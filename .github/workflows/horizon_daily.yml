name: Horizon Daily Aggregation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-verification:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Taipei
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - name: Prepare isolated configuration
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "horizon-live-verification"
          data = root / "data"
          data.mkdir(parents=True, exist_ok=True)
          config = json.loads(Path("data/config.github.json").read_text(encoding="utf-8"))
          config["webhook"]["enabled"] = False
          (data / "config.json").write_text(json.dumps(config, ensure_ascii=False), encoding="utf-8")
          PY
      - name: Run with the existing cloud model
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          target_date="$(date +%F)"
          echo "TARGET_DATE=$target_date" >> "$GITHUB_ENV"
          uv run horizon --hours 24 --target-date "$target_date" --data-dir "$RUNNER_TEMP/horizon-live-verification/data"
      - name: Verify generated summaries
        run: |
          python scripts/horizon_daily_gate.py validate --root "$RUNNER_TEMP/horizon-live-verification" --target-date "$TARGET_DATE"
          python - <<'PY'
          import os, re
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "horizon-live-verification" / "data" / "summaries"
          day = os.environ["TARGET_DATE"]
          for language in ("zh", "en"):
              path = root / f"horizon-{day}-{language}.md"
              text = path.read_text(encoding="utf-8")
              count = len(re.findall(r'^<a id="item-[^"]+"></a>$', text, re.MULTILINE))
              print(f"{language}: {count} items")
              if count != 10:
                  raise SystemExit(f"Expected 10 {language} items; got {count}")
          PY
      - name: Save test summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horizon-live-verification
          path: ${{ runner.temp }}/horizon-live-verification/data/summaries/*.md
          if-no-files-found: warn
          retention-days: 3
